<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Sales Invoice · মনে রাখুন</title>
<style>
  :root { --bg1:#0b1b3a; --bg2:#14307a; --accent:#38bdf8; --ink:#0f172a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width:1920px; height:1080px; overflow:hidden;
    font-family:'Hind Siliguri','Noto Sans Bengali','Nirmala UI',sans-serif; }
  body { display:flex; align-items:center; justify-content:center; color:#fff;
    background: radial-gradient(1800px 1050px at 20% 0%, var(--bg2), var(--bg1)); }
  .card { display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; padding:0 120px; }
  .brand { font-size:36px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);
    font-weight:600; margin-bottom:40px; }
  .tips { text-align:left; font-size:42px; line-height:1.95; color:#e2e8f0; }
  .tips div { margin-bottom:22px; }
  .tips b { color:var(--accent); }
  kbd { background:#fff; color:var(--ink); border-radius:8px; padding:2px 16px;
    font:600 36px/1.4 inherit; box-shadow:0 3px 0 #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">মনে রাখুন</div>
    <div class="tips">
      <div>① প্রতিটি ঘরে লিখে <kbd>Enter</kbd> চাপুন — কার্সর পরের ঘরে যাবে</div>
      <div>② পণ্য যোগ করতে <b>Add New</b>, শেষে <b>Save</b></div>
      <div>③ ভুল হলে তালিকার <b>Action</b> থেকে এডিট; সব মুছতে <b>Reset</b></div>
    </div>
  </div>
</body>
</html>
