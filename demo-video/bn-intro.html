<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Sales Invoice টিউটোরিয়াল</title>
<style>
  :root { --bg1:#0b1b3a; --bg2:#14307a; --accent:#38bdf8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width:1920px; height:1080px; overflow:hidden;
    font-family:'Hind Siliguri','Noto Sans Bengali','Nirmala UI',sans-serif; }
  body { display:flex; align-items:center; justify-content:center; color:#fff;
    background: radial-gradient(1800px 1050px at 20% 0%, var(--bg2), var(--bg1)); }
  .card { display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; padding:0 120px; }
  .brand { font-size:36px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);
    font-weight:600; margin-bottom:26px; }
  h1 { font-size:96px; line-height:1.25; font-weight:700; }
  .accent { color:var(--accent); }
  p { font-size:40px; color:#cbd5e1; margin-top:26px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">CashbookBD · টিউটোরিয়াল</div>
    <h1>Sales Invoice<br><span class="accent">কীভাবে এন্ট্রি করবেন</span></h1>
    <p>কাস্টমার বেছে, পণ্য যোগ করে, সেভ — ধাপে ধাপে</p>
  </div>
</body>
</html>
