# ---------------------------------------------------------------------------
# The MULTI-COMPANY installation (my.cashbookbd.com, database myappsaasdatabase).
#
# One Next.js process serves every company; the company is chosen by HOST, so
# each company's subdomain is listed here (or a wildcard is used). This is the
# file that needs the proposed DNS/proxy change before it can go live:
#
#     *.cashbookbd.com  ->  this server   (wildcard, or one record per company)
#
# ⚠️ NOT APPLIED. Review the URL mapping in ../README.md first.
# ---------------------------------------------------------------------------

upstream tenant_next {
    server 127.0.0.1:3100;
    keepalive 16;
}

# One server block per company subdomain (a wildcard needs its own vhost and is
# not shown here because CloudPanel manages vhosts per server_name).
server {
    listen 443 ssl;
    server_name acme.cashbookbd.com bravo.cashbookbd.com;

    # ... the same path split as tenant-phase2.conf ...

    location ^~ /api/                { try_files $uri /index.php?$query_string; }
    location =  /sanctum/csrf-cookie { try_files $uri /index.php?$query_string; }
    location =  /up                  { try_files $uri /index.php?$query_string; }
    location ~ ^/(login|logout|register|password|privacy|debug)$ { try_files $uri /index.php?$query_string; }
    location ~ ^/products/unit(/|$)  { try_files $uri /index.php?$query_string; }
    location ~ ^/(accounts|hrms|inventory|confidential|payrolls|dropdown|somity-report|admin|bulk-uploader|jobs|position|requisition|tourism|user-management|visa|voucher-upload|subscription|category|email|storage)(/|$) { try_files $uri /index.php?$query_string; }

    location ^~ /site_media/ { try_files $uri =404; }
    location ~ ^/(backend|fontend|assets|images|css|js)/ { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }

    location ^~ /site { proxy_pass http://tenant_next; }
    location ~ ^/(products|contact)(/|$) { proxy_pass http://tenant_next; }
    location = /sitemap.xml { proxy_pass http://tenant_next; }
    location = /robots.txt  { proxy_pass http://tenant_next; }
    location / { proxy_pass http://tenant_next; }

    # proxy_set_header Host $host;
    # proxy_set_header X-Site-Host $host;
    # proxy_set_header X-Forwarded-Proto $scheme;
    # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
