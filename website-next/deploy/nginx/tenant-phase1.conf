# ---------------------------------------------------------------------------
# Phase 1 — the PUBLIC website is rendered by Next.js; the builder is still
# Blade. Append inside the tenant's `server { ... }` block (CloudPanel vhost).
#
# ⚠️ nginx precedence: exact `=` first, then `^~` prefixes, then regexes IN
# ORDER, then the longest plain prefix. So the Laravel rules below win over the
# catch-all `location /` that hands everything else to Next.js.
# ---------------------------------------------------------------------------

upstream tenant_next {
    server 127.0.0.1:3100;
    keepalive 16;
}

# ---- Laravel (php-fpm) -----------------------------------------------------

location ^~ /api/                { try_files $uri /index.php?$query_string; }
location =  /sanctum/csrf-cookie { try_files $uri /index.php?$query_string; }
location =  /up                  { try_files $uri /index.php?$query_string; }

location ~ ^/(login|logout|register|password|privacy|debug)$ {
    try_files $uri /index.php?$query_string;
}

# The application's module prefixes and its own single-segment screens.
# NOTE: `products` is deliberately absent -- only its admin sub-path is the
# application's; /products and /products/{id} are the public website's.
location ~ ^/products/unit(/|$) {
    try_files $uri /index.php?$query_string;
}
location ~ ^/(accounts|hrms|inventory|confidential|payrolls|dropdown|somity-report|admin|bulk-uploader|jobs|position|requisition|tourism|user-management|visa|voucher-upload|subscription|category|email|storage)(/|$) {
    try_files $uri /index.php?$query_string;
}

# ---- static assets served from Laravel's public/ --------------------------
# ^~ /site_media/ MUST be declared before the ^~ /site block in phase 2: the
# longest ^~ prefix wins, so site_media is never captured by the builder.
location ^~ /site_media/ { try_files $uri =404; }
location ~ ^/(backend|fontend|assets|images|css|js)/ { try_files $uri =404; }
location = /favicon.ico { try_files $uri =404; }

# ---- builder STILL ON BLADE in phase 1 ------------------------------------
location =  /site  { try_files $uri /index.php?$query_string; }
location ^~ /site/ { try_files $uri /index.php?$query_string; }

# ---- Next.js: the public website ------------------------------------------

location ~ ^/(products|contact)(/|$) { proxy_pass http://tenant_next; }
location = /sitemap.xml              { proxy_pass http://tenant_next; }
location = /robots.txt               { proxy_pass http://tenant_next; }

# Everything the application did not claim: '/', page slugs, and the home page.
location / { proxy_pass http://tenant_next; }

