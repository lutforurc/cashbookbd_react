# ---------------------------------------------------------------------------
# Phase 2 — as phase 1, but the BUILDER also moves to Next.js.
#
# Apply ONLY after phase 1's public site has passed on this tenant. The only
# difference is the two /site blocks: they now proxy to Next.js instead of
# php-fpm. Blade's /site routes stay registered but are no longer reachable, so
# the old builder remains available as a rollback by restoring phase 1.
# ---------------------------------------------------------------------------

upstream tenant_next {
    server 127.0.0.1:3100;
    keepalive 16;
}

# ---- Laravel (php-fpm) -----------------------------------------------------

location ^~ /api/                { try_files $uri /index.php?$query_string; }
location =  /sanctum/csrf-cookie { try_files $uri /index.php?$query_string; }
location =  /up                  { try_files $uri /index.php?$query_string; }

location ~ ^/(login|logout|register|password|privacy|debug)$ {
    try_files $uri /index.php?$query_string;
}

location ~ ^/products/unit(/|$) {
    try_files $uri /index.php?$query_string;
}
location ~ ^/(accounts|hrms|inventory|confidential|payrolls|dropdown|somity-report|admin|bulk-uploader|jobs|position|requisition|tourism|user-management|visa|voucher-upload|subscription|category|email|storage)(/|$) {
    try_files $uri /index.php?$query_string;
}

# ---- static assets --------------------------------------------------------
# Order matters: this ^~ is longer than ^~ /site, so it wins for site_media.
location ^~ /site_media/ { try_files $uri =404; }
location ~ ^/(backend|fontend|assets|images|css|js)/ { try_files $uri =404; }
location = /favicon.ico { try_files $uri =404; }

# ---- builder in Next.js ---------------------------------------------------
location ^~ /site { proxy_pass http://tenant_next; }

# ---- Next.js: the public website ------------------------------------------
location ~ ^/(products|contact)(/|$) { proxy_pass http://tenant_next; }
location = /sitemap.xml              { proxy_pass http://tenant_next; }
location = /robots.txt               { proxy_pass http://tenant_next; }

location / { proxy_pass http://tenant_next; }

