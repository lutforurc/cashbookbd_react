<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Component Card Gradients -->
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="invGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="hrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glows for Depth -->
  <circle cx="900" cy="200" r="150" fill="#10b981" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="450" r="180" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />

  <!-- Abstract Tech Grid/Lines in Background -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="230" x2="1200" y2="230" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="530" x2="1200" y2="530" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="820" y1="0" x2="820" y2="630" />
  </g>

  <!-- LEFT BRANDING SIDE -->
  <g transform="translate(80, 0)">
    <!-- System Tag -->
    <rect x="0" y="140" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="156" r="5" fill="#3b82f6" />
    <text x="36" y="161" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">ALL-IN-ONE ERP</text>

    <!-- Main Typography -->
    <text x="0" y="230" font-family="system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Business Control Center
    </text>
    <text x="0" y="280" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Unified platform for smarter operations.
    </text>

    <!-- Bullet Points with Icons -->
    <!-- Feature 1: Accounting -->
    <g transform="translate(0, 340)">
      <rect width="40" height="40" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/>
      <!-- Ledger Icon -->
      <path d="M14 15h12M14 20h12M14 25h8" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <text x="56" y="18" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Accounting &amp; Finance</text>
      <text x="56" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#64748b">Vouchers, Ledgers &amp; Real-time Reports</text>
    </g>

    <!-- Feature 2: Inventory -->
    <g transform="translate(0, 415)">
      <rect width="40" height="40" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/>
      <!-- Box/Stock Icon -->
      <path d="M20 12l10 5-10 5-10-5 10-5zM10 17v10l10 5M30 17v10l-10 5" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="18" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Inventory &amp; Stock</text>
      <text x="56" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#64748b">Track Sales, Purchases &amp; Stock Levels</text>
    </g>

    <!-- Feature 3: HRMS -->
    <g transform="translate(0, 490)">
      <rect width="40" height="40" rx="10" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.5"/>
      <!-- HR/Users Icon -->
      <path d="M15 17a4 4 0 118 0 4 4 0 01-8 0zM11 29c0-4 4-5 8-5s8 1 8 5" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
      <text x="56" y="18" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">HRMS &amp; Payroll</text>
      <text x="56" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#64748b">Complete Employee Lifecycle &amp; Workflows</text>
    </g>
  </g>

  <!-- RIGHT VISUAL SIDE (Dashboard Mockups) -->
  <g transform="translate(680, 100)">
    
    <!-- Card 1: Accounting (Back Layer) -->
    <g transform="translate(40, 40)">
      <rect width="360" height="240" rx="16" fill="url(#accGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
      <rect width="360" height="45" rx="16" fill="#0f172a" opacity="0.8"/>
      <circle cx="25" cy="22" r="5" fill="#ef4444" />
      <circle cx="40" cy="22" r="5" fill="#eab308" />
      <circle cx="55" cy="22" r="5" fill="#22c55e" />
      <text x="80" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b">Accounting_Ledger_Final.xlsx</text>
      
      <!-- Graph Line Graphic -->
      <path d="M40 180 q 40 -60, 90 -20 t 90 -70 t 100 30" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <circle cx="220" cy="90" r="5" fill="#f8fafc" stroke="#10b981" stroke-width="2" />
    </g>

    <!-- Card 2: Inventory (Middle Layer) -->
    <g transform="translate(80, 140)">
      <rect width="360" height="240" rx="16" fill="url(#invGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" filter="drop-shadow(0 20px 13px rgb(0 0 0 / 0.3))" />
      <rect width="360" height="45" rx="16" fill="#0f172a" opacity="0.8"/>
      <text x="25" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f59e0b">Stock Status: Optimal</text>
      
      <!-- Inventory Bars -->
      <rect x="30" y="80" width="120" height="15" rx="4" fill="#334155"/>
      <rect x="30" y="80" width="95" height="15" rx="4" fill="#f59e0b"/>
      
      <rect x="30" y="115" width="120" height="15" rx="4" fill="#334155"/>
      <rect x="30" y="115" width="45" height="15" rx="4" fill="#ef4444"/>

      <rect x="30" y="150" width="120" height="15" rx="4" fill="#334155"/>
      <rect x="30" y="150" width="110" height="15" rx="4" fill="#10b981"/>
      
      <!-- Simplified Pie Chart -->
      <circle cx="260" cy="135" r="45" fill="none" stroke="#334155" stroke-width="20"/>
      <circle cx="260" cy="135" r="45" fill="none" stroke="#f59e0b" stroke-width="20" stroke-dasharray="180 300" stroke-dashoffset="0"/>
    </g>

    <!-- Card 3: HRMS (Front Focus Layer) -->
    <g transform="translate(0, 240)">
      <rect width="380" height="200" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="drop-shadow(0 25px 25px rgb(0 0 0 / 0.45))" />
      
      <!-- Card Header -->
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 364 0 A 16 16 0 0 1 380 16 L 380 50 L 0 50 Z" fill="#0f172a" />
      <text x="25" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Payroll Workflow</text>
      <rect x="290" y="15" width="65" height="22" rx="11" fill="#2563eb" />
      <text x="303" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">RUN</text>

      <!-- HRMS Content Rows -->
      <!-- Row 1 -->
      <circle cx="40" cy="90" r="16" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="35" y="94" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3b82f6">EM</text>
      <rect x="75" y="78" width="120" height="10" rx="5" fill="#f8fafc"/>
      <rect x="75" y="94" width="70" height="6" rx="3" fill="#64748b"/>
      <text x="290" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#10b981">+$4,250</text>

      <!-- Divider line -->
      <line x1="25" y1="125" x2="355" y2="125" stroke="#334155" stroke-width="1"/>

      <!-- Row 2 -->
      <circle cx="40" cy="160" r="16" fill="#ec4899" fill-opacity="0.2"/>
      <text x="35" y="164" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ec4899">JD</text>
      <rect x="75" y="148" width="100" height="10" rx="5" fill="#f8fafc"/>
      <rect x="75" y="164" width="85" height="6" rx="3" fill="#64748b"/>
      <text x="290" y="165" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#10b981">+$5,100</text>
    </g>

  </g>
</svg>
