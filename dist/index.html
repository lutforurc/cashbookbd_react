<!DOCTYPE html>
<html class="scroll-smooth" lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />

  <script>
    /* The theme, decided before the first frame is painted.
     *
     * React sets this class too, but only once it has mounted and its effects
     * have run -- and the browser has drawn a white page by then. Someone who
     * works in dark mode all day was seeing that flash on every single load.
     *
     * Deliberately silent about the system preference: the app's own default is
     * light, and guessing dark here only to have React switch it back would
     * trade one flash for another. */
    (function () {
      try {
        var stored = window.localStorage.getItem('color-theme');
        if (stored && stored.replace(/^"|"$/g, '') === 'dark') {
          document.documentElement.classList.add('dark');
        }

        /* The language, before the first frame is painted. The app writes
         * these two keys when the user switches; reading them here stops a
         * Bangla session from opening in English for a frame. */
        var lang = window.localStorage.getItem('ui-lang');
        if (lang) {
          lang = lang.replace(/^"|"$/g, '');
          if (lang) {
            document.documentElement.lang = lang;
            document.documentElement.setAttribute('data-lang', lang);
          }
        }

        var dir = window.localStorage.getItem('ui-dir');
        if (dir) {
          dir = dir.replace(/^"|"$/g, '');
          if (dir === 'rtl' || dir === 'ltr') {
            document.documentElement.dir = dir;
          }
        }
      } catch (e) {
        /* Private mode, storage disabled -- light and English are fine answers. */
      }
    })();
  </script>
