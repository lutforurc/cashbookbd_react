name: Staging React App CI/CD Pipeline

# The build no longer runs here. This workflow ships the source to the server
# and pokes deploy/script.sh, which builds and publishes there. The trigger
# returns at once, so a dropped ssh connection can no longer kill a build
# half-way; the wait step below is what decides whether the deploy worked.

on:
  push:
    branches:
      - react-staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        site:
          [
            cashbookbdaccountsstaging,
            cashbookbdaccountseworld
          ]

    steps:

      # 1) Checkout
      - uses: actions/checkout@v4

      # 2) Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo '${{ secrets.REACT_MAIN_PRIVATE_KEY }}' > ~/.ssh/key
          chmod 600 ~/.ssh/key
          echo -e "Host *\n  IdentityFile ~/.ssh/key\n  StrictHostKeyChecking=accept-new" > ~/.ssh/config

      # 3) Resolve the public host, to confirm later that it serves this commit.
      #    The deploy dir and API URL live in deploy/script.sh, next to the build.
      - name: Resolve site host
        id: site
        run: |
          case "${{ matrix.site }}" in
            cashbookbdaccountsstaging) echo "host=accounts.staging.cashbookbd.com" ;;
            cashbookbdaccountseworld) echo "host=accounts.eworld.cashbookbd.com" ;;
            *) echo "Unknown site"; exit 1 ;;
          esac >> $GITHUB_OUTPUT

      # 4) Ship the source. Its own directory per site, so the two matrix jobs
      #    cannot build over each other. node_modules and dist are rebuilt on
      #    the server and .git is not needed there.
      - name: Upload source
        run: |
          rsync -az --delete \
            --exclude .git --exclude node_modules --exclude dist \
            -e "ssh -p 22" \
            ./ \
            "${{ secrets.REACT_MAIN_SSH_USER }}@${{ secrets.REACT_MAIN_HOST }}:deploy/src/${{ matrix.site }}/"

      # 5) Build (on the server). Returns as soon as the build is accepted.
      #    Run through `sh` so a lost +x bit on the checkout cannot break this.
      - name: Trigger build
        run: |
          ssh "${{ secrets.REACT_MAIN_SSH_USER }}@${{ secrets.REACT_MAIN_HOST }}" \
            "sh deploy/src/${{ matrix.site }}/deploy/script.sh '${{ matrix.site }}' '${{ github.sha }}'"

      # 6) Wait for the live site to serve this commit. The build writes its sha
      #    into dist last, so this is only true once it finished and published.
      - name: Wait for the deploy to go live
        run: |
          URL="https://${{ steps.site.outputs.host }}/build-sha.txt"
          for _ in $(seq 1 60); do
            GOT=$(curl -fsS --max-time 10 "$URL?t=$(date +%s)" | tr -d '[:space:]' || true)
            if [ "$GOT" = "${{ github.sha }}" ]; then
              echo "live: ${{ matrix.site }} is serving ${{ github.sha }}"
              exit 0
            fi
            sleep 15
          done
          echo "::error::${{ matrix.site }} did not serve ${{ github.sha }} within 15 minutes"
          exit 1

      # 7) The build output never reaches this runner, so on failure fetch the
      #    tail of the server log - otherwise there is nothing to go on.
      - name: Server build log
        if: failure()
        run: |
          ssh "${{ secrets.REACT_MAIN_SSH_USER }}@${{ secrets.REACT_MAIN_HOST }}" \
            "tail -n 60 'deploy/${{ matrix.site }}.log'" || true
